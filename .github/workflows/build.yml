name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  logic-tests:
    name: Runtime & optimizer tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: bash tests/run.sh

  kotlin:
    name: App compile check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle :app:compileDebugKotlin :app:lintDebug --no-daemon --continue

  engine:
    name: mkxp-z engine (arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake bison autoconf automake libtool pkg-config gperf ruby python3-pip xxd
          pip3 install --break-system-packages "meson>=1.4"

      - name: Set up NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Cache meson subprojects
        uses: actions/cache@v4
        with:
          path: native/.work/mkxp-z/subprojects/packagecache
          key: mkxpz-subprojects-${{ hashFiles('native/build-mkxp.sh') }}

      - name: Build engine
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash native/build-mkxp.sh

      - name: Show configure logs on failure
        if: failure()
        run: |
          for f in $(find native/.work/build-arm64 -name config.log -o -name 'meson-log.txt' | head -20); do
            echo "::group::$f"
            grep -n -B2 -A40 -E "is valid|error:|Error " "$f" | tail -n 200 || tail -n 120 "$f"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: libmain-arm64
          path: app/src/main/jniLibs/arm64-v8a/libmain.so

  apk:
    name: Android APK
    needs: [engine, logic-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libmain-arm64
          path: app/src/main/jniLibs/arm64-v8a
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.YAMI_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/yami.jks"
            echo "YAMI_KEYSTORE_FILE=$RUNNER_TEMP/yami.jks" >> "$GITHUB_ENV"
            echo "Signing with the repository key"
          else
            echo "::warning::YAMI_KEYSTORE_B64 secret not set — signing with a throwaway debug key (updates won't install over older builds)"
          fi

      - name: Assemble
        env:
          YAMI_KEYSTORE_PASSWORD: ${{ secrets.YAMI_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: yami-apk
          path: app/build/outputs/apk/**/*.apk

      - name: Publish "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Yami.apk
          cp app/build/outputs/apk/debug/app-debug.apk Yami-debug.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Yami.apk Yami-debug.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Yami (latest build)" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Install **Yami.apk** (arm64). Yami-debug.apk is the same build with debugging enabled."
